<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Scientific Scanner</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  height: 100vh;
  background: linear-gradient(135deg, #0f172a, #1e3a5f);
  display: flex;
  justify-content: center;
  align-items: center;
  color: #e5e7eb;
}

.container {
  width: 420px;
  padding: 40px;
  border-radius: 18px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  text-align: center;
}

h1 {
  font-size: 22px;
  margin-bottom: 5px;
}

.subtitle {
  font-size: 13px;
  color: #9ca3af;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  outline: none;
  font-size: 15px;
  background: rgba(255,255,255,0.08);
  color: #e5e7eb;
  text-align: center;
  margin-bottom: 15px;
}

.buttons {
  display: flex;
  gap: 10px;
  justify-content: center;
}

button {
  padding: 10px 20px;
  border-radius: 8px;
  border: none;
  font-size: 14px;
  cursor: pointer;
  font-weight: 600;
  transition: 0.2s;
}

.scan {
  background: #38bdf8;
  color: #0f172a;
}

.scan:hover {
  background: #0ea5e9;
}

.reset {
  background: #374151;
  color: #e5e7eb;
}

.reset:hover {
  background: #4b5563;
}

#result {
  margin-top: 20px;
  font-size: 20px;
  font-weight: 600;
  min-height: 28px;
}

.yes {
  color: #22c55e;
}

.no {
  color: #ef4444;
}

.info {
  margin-top: 10px;
  font-size: 12px;
  color: #9ca3af;
}
</style>
</head>

<body>

<div class="container">
  <h1>Scientific Scanner</h1>
  <div class="subtitle">Format: a × 10^n</div>

  <input id="inputNumber" placeholder="Example: 5 x 10^2">

  <div class="buttons">
    <button class="scan" onclick="checkScientific()">Scan</button>
    <button class="reset" onclick="resetForm()">Reset</button>
  </div>

  <div id="result"></div>
  <div class="info" id="info"></div>
</div>

<script>
const input = document.getElementById("inputNumber");

input.addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    checkScientific();
  }
});

function checkScientific() {
  let value = input.value.trim();
  let result = document.getElementById("result");
  let info = document.getElementById("info");

  // Pola lebih ketat (harus 10^n)
  let pattern = /^-?\d+(\.\d+)?\s?x\s?10\^-?\d+$/i;

  if (value === "") {
    result.textContent = "Input kosong";
    result.className = "no";
    info.textContent = "";
    return;
  }

  if (pattern.test(value)) {
    result.textContent = "VALID";
    result.className = "yes";
    info.textContent = "Format sesuai notasi ilmiah";
  } else {
    result.textContent = "INVALID";
    result.className = "no";

    if (value.includes("10") === false) {
      info.textContent = "Harus menggunakan basis 10 (contoh: 3 x 10^2)";
    } else if (value.includes("^") === false) {
      info.textContent = "Gunakan pangkat (contoh: 10^2)";
    } else {
      info.textContent = "Format salah. Gunakan bentuk a x 10^n";
    }
  }
}

function resetForm() {
  input.value = "";
  document.getElementById("result").textContent = "";
  document.getElementById("info").textContent = "";
  input.focus();
}
</script>

</body>
</html>
